version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/restosync_pos
      - JWT_SECRET=restosync_secret_key_2026
      - JWT_REFRESH_SECRET=restosync_refresh_secret_key_2026
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
