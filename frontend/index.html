<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacky Pizza POS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111827;
        --panel: #1f2937;
        --text: #f9fafb;
        --muted: #d1d5db;
        --accent: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        width: min(90vw, 720px);
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0;
      }
      .badge {
        display: inline-block;
        margin-bottom: 18px;
        background: rgba(245, 158, 11, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.4);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Frontend status</div>
      <h1>Hacky Pizza POS</h1>
      <p>
        Vercel ko index.html chahiye tha, aur is file ko GitHub repo me add kar diya gaya hai.
        Agar aap actual frontend app build karna chahte ho, to usko is folder me proper React/Vite ya web build ke saath replace karna hoga.
      </p>
    </main>
  </body>
</html>
