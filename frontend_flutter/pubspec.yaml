name: hacky_pizza_pos
description: A production‑ready restaurant POS app for Hacky Pizza.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: "^3.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^14.2.0
  http: ^1.2.2
  socket_io_client: ^2.0.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^7.0.0
  fl_chart: ^0.68.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/splash_background.png
